[project]
name = "litestar-example-plugin"
version = "0.1.0"
description = "Build and package your own Litestar plugin, with an example app and tests included."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["litestar>=2.24"]

[dependency-groups]
dev = ["litestar[standard]>=2.24", "pytest>=8", "anyio>=4", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/litestar_example_plugin"]
