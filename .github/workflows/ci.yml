name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  manifest:
    name: Validate templates.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check manifest matches folders
        run: |
          python3 - << 'EOF'
          import json, os, sys

          manifest = json.load(open("templates.json"))
          errors = []
          for t in manifest["templates"]:
              d = t["directory"]
              if not os.path.isdir(d):
                  errors.append(f"manifest entry '{t['name']}' points to missing folder '{d}'")
              elif not os.path.isfile(os.path.join(d, "pyproject.toml")):
                  errors.append(f"folder '{d}' has no pyproject.toml")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"manifest OK — {len(manifest['templates'])} templates")
          EOF

  test:
    name: Test ${{ matrix.template }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template:
          - minimal
          - api
          - middleware
          - plugin
          - jwt-auth
          - advanced-alchemy
    defaults:
      run:
        working-directory: ${{ matrix.template }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest
