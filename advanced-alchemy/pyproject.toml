[project]
name = "litestar-advanced-alchemy-starter"
version = "0.1.0"
description = "Database starter with Advanced Alchemy — SQLAlchemy models, repository/service layer, and CRUD endpoints."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "litestar[standard]>=2.24",
    "advanced-alchemy>=1.0",
    "aiosqlite>=0.20",
]

[dependency-groups]
dev = ["pytest>=8", "anyio>=4", "httpx>=0.28"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
