[project]
name = "litestar-advanced-alchemy-starter"
version = "0.1.0"
description = "CRUD on a real database with SQLAlchemy models and Advanced Alchemy services."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "litestar[standard]>=2.24",
    "advanced-alchemy>=1.0",
    "aiosqlite>=0.20",
]

[project.scripts]
app = "app.__main__:run_cli"

[dependency-groups]
dev = ["pytest>=8", "anyio>=4", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
