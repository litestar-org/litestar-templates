[project]
name = "litestar-api-starter"
version = "0.1.0"
description = "A REST API organized by domain, the same way litestar-fullstack does it, with OpenAPI docs built in."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["litestar[standard]>=2.24"]

[project.scripts]
app = "app.__main__:run_cli"

[dependency-groups]
dev = ["pytest>=8", "anyio>=4", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
