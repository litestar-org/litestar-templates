[project]
name = "litestar-api-starter"
version = "0.1.0"
description = "REST API starter with a CRUD controller, msgspec models, validation, and OpenAPI documentation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["litestar[standard]>=2.24"]

[dependency-groups]
dev = ["pytest>=8", "anyio>=4", "httpx>=0.28"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
