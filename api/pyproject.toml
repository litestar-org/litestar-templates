[project]
name = "litestar-api-starter"
version = "0.1.0"
description = "Domain-driven REST API starter — bounded contexts with controllers/schemas/services, an application core plugin, and OpenAPI documentation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["litestar[standard]>=2.24"]

[dependency-groups]
dev = ["pytest>=8", "anyio>=4", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
