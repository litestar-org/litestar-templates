[project]
name = "litestar-middleware-starter"
version = "0.1.0"
description = "Write your own ASGI middleware. Ships a working timing-header example with tests."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["litestar[standard]>=2.24"]

[dependency-groups]
dev = ["pytest>=8", "anyio>=4", "httpx>=0.28"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
