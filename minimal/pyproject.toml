[project]
name = "litestar-minimal-starter"
version = "0.1.0"
description = "A single route and nothing else. The fastest way to try Litestar."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["litestar[standard]>=2.24"]

[dependency-groups]
dev = ["pytest>=8", "anyio>=4", "httpx>=0.28"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
